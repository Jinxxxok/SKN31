<!-- templates/polls/vote_result.html -->
{% extends 'layout/main_layout.html' %}
{% block title %}투표결과{% endblock title %}
{% block contents %}
    <h1>투표결과</h1>
    <b>질문: {{question.pk}}. {{question.question_text}}</b>
    <ol>
        {% for choice in choice_list %}
            <li class="form-control">{{choice.choice_text}} - {{choice.vote}}</li>   
        {% endfor %}
    </ol>
{% endblock contents %}
